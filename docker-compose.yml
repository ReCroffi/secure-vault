services:
  postgres:
    image: postgres:16
    container_name: secure-vault-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - vault_pgdata:/var/lib/postgresql/data

volumes:
  vault_pgdata:
